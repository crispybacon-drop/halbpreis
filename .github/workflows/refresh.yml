name: Angebote aktualisieren

on:
  schedule:
    # Once a day, 05:17 UTC (06:17 in Zurich in winter, 07:17 in summer).
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Load previous data
        run: |
          mkdir -p out
          if git fetch --depth=1 origin data 2>/dev/null; then
            git show origin/data:deals.json > out/prev-deals.json 2>/dev/null || true
            git show origin/data:history.json > out/prev-history.json 2>/dev/null || true
          fi

      - name: Scrape stores
        run: node scraper/run.mjs out

      - name: Publish to data branch
        run: |
          cd out
          rm -f prev-deals.json prev-history.json
          git init -q -b data
          git config user.name "halbpreis-bot"
          git config user.email "halbpreis-bot@users.noreply.github.com"
          git add deals.json history.json log.txt
          git commit -q -m "Angebote $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
